<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Чат</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 500px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            border-radius: 5px;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        input[type="text"], input[type="password"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #chat {
            width: 100%;
            height: 300px;
            border: 1px solid #ccc;
            overflow-y: scroll;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        #chat p {
            margin: 5px 0;
            word-wrap: break-word;
        }

        #message {
            width: calc(100% - 20px);
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        #rooms {
            margin-top: 20px;
            text-align: center;
        }

        #rooms button {
            width: auto;
            display: inline-block;
            margin: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>WebSocket Чат</h1>

        <button onclick="openLoginModal()">Войти</button>
        <button onclick="openRegisterModal()">Зарегистрироваться</button>

        <div id="rooms">
            <h2>Доступные комнаты:</h2>
            <!-- Список комнат будет здесь -->
        </div>

        <div id="chat"></div>
        <input type="text" id="message" placeholder="Введите сообщение">
        <button onclick="sendMessage()">Отправить</button>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeLoginModal()">&times;</span>
            <h2>Вход</h2>
            <input type="text" id="loginUsername" placeholder="Имя пользователя">
            <input type="password" id="loginPassword" placeholder="Пароль">
            <button onclick="login()">Войти</button>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeRegisterModal()">&times;</span>
            <h2>Регистрация</h2>
            <input type="text" id="registerUsername" placeholder="Имя пользователя">
            <input type="password" id="registerPassword" placeholder="Пароль">
            <button onclick="register()">Зарегистрироваться</button>
        </div>
    </div>

    <script>
        // Ваши переменные и функции
        let socket;
        let username;
        let room;

        // Modal Functions
        function openLoginModal() {
            document.getElementById("loginModal").style.display = "block";
        }

        function closeLoginModal() {
            document.getElementById("loginModal").style.display = "none";
        }

        function openRegisterModal() {
            document.getElementById("registerModal").style.display = "block";
        }

        function closeRegisterModal() {
            document.getElementById("registerModal").style.display = "none";
        }

        // Registration
        async function register() {
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;

            const response = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `username=${username}&password=${password}`
            });

            const result = await response.text();
            alert(result);
            closeRegisterModal();
        }

        // Login
        async function login() {
            username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `username=${username}&password=${password}`
            });

            const result = await response.text();
            if (result.includes("Успешный вход")) {
                closeLoginModal();
                room = prompt("Введите название комнаты:", "default");
                connectWebSocket();
            } else {
                alert(result);
            }
        }

        // WebSocket Connection
        function connectWebSocket() {
            const chat = document.getElementById('chat');
            socket = new WebSocket(`ws://localhost:8080/ws?username=${username}&room=${room}`);

            socket.onopen = function(event) {
                chat.innerHTML += '<p><em>Подключено к комнате: ' + room + ' как ' + username + '</em></p>';
            };

            socket.onmessage = function(event) {
                chat.innerHTML += '<p>' + event.data + '</p>';
                chat.scrollTop = chat.scrollHeight;
            };

            socket.onclose = function(event) {
                chat.innerHTML += '<p><em>Соединение закрыто</em></p>';
            };
        }

        // Send Message
        function sendMessage() {
            const message = document.getElementById('message').value;
            if (message.trim() !== "") {
                socket.send(message);
                document.getElementById('message').value = '';
            }
        }

        // Load Rooms
        async function loadRooms() {
            const response = await fetch('/rooms');
            const rooms = await response.json();
            const roomsDiv = document.getElementById('rooms');

            rooms.forEach(roomName => {
                const button = document.createElement('button');
                button.textContent = roomName;
                button.onclick = function() {
                    room = roomName;
                    if (!username) {
                        alert("Сначала войдите!");
                        return;
                    }
                    connectWebSocket();
                };
                roomsDiv.appendChild(button);
            });
        }

        // On Load
        document.addEventListener('DOMContentLoaded', function() {
            loadRooms();
        });
    </script>
</body>
</html>
